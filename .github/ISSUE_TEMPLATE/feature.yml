name: 功能建议 / Feature request
description: 提议新的使用场景、能力或交互。
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 issue。描述具体问题比直接提交实现方案更容易评估。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在什么情况下遇到了什么限制？
      placeholder: 例如：截图标注箭头时，目前无法直接控制曲线走向。
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 当前替代方案
      description: 现在如何完成这件事？没有替代方案也可以填写“无”。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 描述用户看到和操作到的结果，不必限定内部实现。
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 相关功能模块
      options:
        - 截图
        - 剪贴板历史
        - 鼠标手势
        - 快捷键
        - 窗口切换
        - 设置与外观
        - 安装与更新
        - 其他或跨模块
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 完成标准
      description: 哪些可观察结果出现时，可以认为这个需求已经完成？
      placeholder: |
        - 用户可以……
        - 当……时，应用……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
      description: 可选。说明你考虑过的其他做法、限制或兼容性影响。

  - type: textarea
    id: attachments
    attributes:
      label: 参考图、录屏或示例
      description: 提交 issue 后可直接将文件拖入描述框。
